<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#a8c0f0;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glassBlur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background panels (Glassmorphism) -->
  <rect x="50" y="50" width="300" height="300" rx="20" ry="20" fill="url(#mainGradient)" filter="url(#glassBlur)" />
  <rect x="70" y="70" width="260" height="260" rx="15" ry="15" fill="#ffffff" fill-opacity="0.1" />

  <!-- Inner display screen -->
  <rect x="100" y="100" width="200" height="200" rx="10" ry="10" fill="#2d3a5e" />

  <!-- Text and UI elements on the inner screen -->
  <text x="120" y="130" font-family="Arial" font-size="16" fill="#f0f8ff">AI-Match Score</text>
  <text x="140" y="170" font-family="Arial" font-size="36" fill="#f0f8ff" font-weight="bold">95%</text>

  <!-- Smaller icons and elements -->
  <rect x="120" y="190" width="160" height="5" fill="#f0f8ff" fill-opacity="0.2" rx="2.5" />
  <rect x="120" y="200" width="120" height="5" fill="#f0f8ff" fill-opacity="0.2" rx="2.5" />
  <rect x="120" y="210" width="100" height="5" fill="#f0f8ff" fill-opacity="0.2" rx="2.5" />

  <!-- Glass orb with graph -->
  <circle cx="300" cy="300" r="40" fill="url(#mainGradient)" fill-opacity="0.7" filter="url(#glassBlur)"/>
  <path d="M 280 320 L 290 300 L 300 310 L 310 290 L 320 300" stroke="#f0f8ff" stroke-width="2" fill="none" />

  <!-- Base and stand -->
  <ellipse cx="200" cy="350" rx="100" ry="20" fill="url(#mainGradient)" fill-opacity="0.5" filter="url(#glassBlur)"/>
</svg>
